name: Publish queued article to DEV

on:
  workflow_dispatch:
  push:
    paths:
      - 'queue/trigger-dev.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate DEV credential
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "DEVTO_API_KEY secret is missing. Nothing will be published."
            exit 1
          fi

      - name: Publish article
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python scripts/publish_dev.py

      - name: Persist publication state
        run: |
          if git diff --quiet -- queue/001-ai-delegation-matrix.json; then
            echo "No queue state change to commit."
            exit 0
          fi
          git config user.name "forsatnet-authority-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue/001-ai-delegation-matrix.json
          git commit -m "Mark DEV article as published [skip ci]"
          git push
